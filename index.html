    <meta name="facebook-domain-verification" content="rziv84rq1rv5o3iaxrz4u80f1lddbx" />

    <!-- Theme color: matches the brand's deep-carbon background in both the
         browser chrome (Android/desktop Chrome) and the OS status bar when
         installed standalone. Single value since the app is dark-themed
         end-to-end — no light variant to switch to. -->
    <meta name="theme-color" content="#07050c" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS: run as a standalone app (no Safari chrome), translucent status
         bar so content flows under the notch (safe-area insets in CSS
         compensate), and the name shown under the home-screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ELIZA" />

    <!-- Android/desktop Chrome standalone hint (mirrors apple-mobile-web-app-capable). -->
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="description" content="Plataforma inteligente que administra, organiza e impulsiona a clínica odontológica moderna com IA nativa." />

    <!-- Public commercial identity (crawlers, link previews, Meta business
         verification) — kept separate from apple-mobile-web-app-title/
         manifest short_name below, which stay the short "ELIZA" mark to
         avoid ugly truncation on home-screen icons. -->
    <meta property="og:site_name" content="Eliza Clínica Inteligente" />
    <meta property="og:title" content="Eliza Clínica Inteligente" />
    <meta property="og:description" content="Plataforma inteligente que administra, organiza e impulsiona a clínica odontológica moderna com IA nativa." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <script>
      // O Portal do Paciente (rota /portal/*) precisa do PRÓPRIO manifest —
      // um paciente que instala pelo Portal precisa que o ícone salvo na
      // tela abra direto em /portal, nunca em "/" (que é o app da clínica:
      // sem sessão Firebase ali, cai na landing pública/cadastro/checkout).
      // Troca o href ANTES de qualquer outra coisa rodar — script síncrono,
      // sem defer/module, bloqueia o parsing até terminar.
      if (location.pathname.indexOf('/portal') === 0) {
        document.getElementById('app-manifest').setAttribute('href', '/manifest-portal.json');
      }
    </script>

    <title>Eliza Clínica Inteligente</title>

    <style>
      /* Instant dark backdrop before React/CSS bundles paint — avoids a
         white flash on cold start, especially noticeable in standalone
         mode where there's no browser chrome to mask it. */
      html, body { background: #07050c; }
      #root:empty { min-height: 100vh; }
    </style>

    <script>
      // iOS Safari's 100dvh can still lag or misreport in standalone PWA
      // mode (its own toolbar-collapse recalculation and safe-area timing
      // don't always agree with the CSS unit) — measuring the real,
      // currently-visible height in JS and exposing it as --app-vh is the
      // long-standing reliable fix for the "gap at the bottom edge" this
      // causes. Runs before the app mounts and on every resize/orientation/
      // visualViewport change, so full-screen shells that read this
      // variable always match the true screen height, on any device.
      (function () {
        function setAppVh() {
          var vv = window.visualViewport;
          var h = vv ? vv.height : window.innerHeight;
          document.documentElement.style.setProperty('--app-vh', h + 'px');
        }
        setAppVh();
        window.addEventListener('resize', setAppVh);
        window.addEventListener('orientationchange', setAppVh);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setAppVh);
          window.visualViewport.addEventListener('scroll', setAppVh);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
