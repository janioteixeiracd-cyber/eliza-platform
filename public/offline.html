<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07050c" />
    <title>ELIZA — Sem conexão</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #07050c;
        background-image: radial-gradient(circle at 50% 20%, rgba(139,92,246,0.16) 0%, transparent 60%);
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
      }
      .wrap {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px;
        padding-top: calc(32px + env(safe-area-inset-top));
        padding-bottom: calc(32px + env(safe-area-inset-bottom));
      }
      img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 0 40px rgba(139,92,246,0.35); }
      h1 {
        margin: 24px 0 8px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.01em;
        background: linear-gradient(135deg, #5b21b6 0%, #8b5cf6 55%, #ddd6fe 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { margin: 0; max-width: 320px; font-size: 13px; line-height: 1.6; color: #94a3b8; }
      button {
        margin-top: 28px;
        padding: 12px 28px;
        border-radius: 12px;
        border: none;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: white;
        background: linear-gradient(135deg, #5b21b6 0%, #8b5cf6 55%, #ddd6fe 100%);
        box-shadow: 0 0 24px rgba(139,92,246,0.35);
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/icons/icon-192.png" alt="ELIZA" />
      <h1>Sem conexão no momento</h1>
      <p>Não foi possível carregar essa página. Assim que a internet voltar, a ELIZA reconecta automaticamente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
